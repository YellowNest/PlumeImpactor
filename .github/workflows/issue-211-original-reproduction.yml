name: Original issue 211 signing reproduction
on:
  push:
    branches:
      - test/issue-211-original-reproduction

permissions:
  contents: read

jobs:
  original-bug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Confirm original apple-codesign dependency
        run: |
          grep -F 'git = "https://github.com/bitxeno/apple-platform-rs", branch = "macho"' crates/plume_core/Cargo.toml
      - name: Prove original signer fails on CAFEBABE Java bytecode
        shell: bash
        run: |
          set -uo pipefail
          # A failing test is the expected result here. Keep it inside
          # the conditional so the runner's bash -e does not exit early.
          if cargo test --locked -p plume_utils --lib signer::tests::java_class_resource_is_sealed_without_macho_signing -- --nocapture 2>&1 | tee /tmp/issue-211-reproduction.log; then
            echo "Unexpected pass: baseline did not reproduce the issue"
            exit 1
          fi
          if grep -F 'Error: Codesign(Goblin(BufferTooShort(61, "arches")))' /tmp/issue-211-reproduction.log >/dev/null; then
            echo "EXPECTED FAILURE CONFIRMED: unpatched signer attempts Mach-O parsing on Java bytecode."
          else
            echo "Failure did not match the expected signing error"
            exit 1
          fi
