[package]
name = "plume_utils"
description = "Utility functions and types for Impactor tools."
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
idevice.workspace = true
thiserror.workspace = true
uuid.workspace = true
plist.workspace = true
tokio.workspace = true
futures.workspace = true
log.workspace = true
image.workspace = true
goblin.workspace = true
plume_core = { path = "../plume_core", features = ["tweaks"] }
plume_store = { path = "../plume_store" }
regex = "1.11.2"

# TODO: replace zip with decompress
zip = { version = "4.3", default-features = false, features = ["deflate"] }
# Vendored from https://github.com/PlumeImpactor/decompress @ 75a3016
# (was a private git dep; vendored so CI/forks build without extra credentials)
decompress = { path = "../../3rdparty/decompress" }
flate2 = "1.1"
